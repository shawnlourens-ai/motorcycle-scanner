<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Motorcycle Entry</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<!-- ZXing PDF417 Barcode Scanner -->
<script src="https://unpkg.com/@zxing/library@latest"></script>

<!-- EmailJS SDK -->
<script src="https://cdn.emailjs.com/sdk/3.2/email.min.js"></script>

<style>
body {
  font-family: Arial, sans-serif;
  background:#f4f4f4;
  margin:0;
  padding:0;
}
.card {
  display:none;
  padding:20px;
  background:#fff;
  margin:20px auto;
  max-width:420px;
  border-radius:10px;
  box-shadow:0 2px 6px rgba(0,0,0,0.2);
}
.card.active { display:block; }
button {
  padding:12px;
  width:100%;
  margin-top:12px;
  font-size:16px;
  border:none;
  background:#007bff;
  color:#fff;
  border-radius:5px;
  cursor:pointer;
}
button:hover { background:#0056b3; }
input {
  width:100%;
  padding:10px;
  margin-top:8px;
  font-size:16px;
  border-radius:5px;
  border:1px solid #ccc;
}
video {
  width:100%;
  margin-top:10px;
  border-radius:8px;
}
.hidden { display:none; }
</style>
</head>

<body>

<!-- ===== CARD 1: Scan & Motorcycles ===== -->
<div class="card active" id="card1">
  <h2>Vehicle Entry</h2>

  <button type="button" id="scanButton">📷 Scan Reg</button>
  <video id="video" class="hidden"></video>

  <input type="text" id="vehicleReg" placeholder="Vehicle Reg" readonly>
  <input type="number" id="motorcycles" placeholder="Number of motorcycles">

  <p><strong>Total:</strong> R<span id="total">0</span></p>

  <button type="button" onclick="nextCard(2)">Next</button>
</div>

<!-- ===== CARD 2: Customer Info ===== -->
<div class="card" id="card2">
  <h2>Total due: R<span id="total2"></span></h2>

  <input type="text" id="name" placeholder="Name">
  <input type="text" id="surname" placeholder="Surname">
  <input type="tel" id="phone" placeholder="Telephone">

  <button type="button" onclick="nextCard(3)">Next</button>
</div>

<!-- ===== CARD 3: Payment Confirmation ===== -->
<div class="card" id="card3">
  <label>
    <input type="checkbox" id="paid"> Payment received
  </label>

  <button type="button" onclick="complete()">Complete</button>
</div>

<script>
/* ======================
   CONFIG: EmailJS
====================== */
emailjs.init("YOUR_PUBLIC_KEY"); // <-- replace with your EmailJS public key

/* ======================
   GLOBAL VARIABLES
====================== */
let codeReader;
let scanning = false;
let latitude = "";
let longitude = "";

/* ======================
   GEOLOCATION
====================== */
navigator.geolocation.getCurrentPosition(pos => {
  latitude = pos.coords.latitude;
  longitude = pos.coords.longitude;
});

/* ======================
   START SCAN
====================== */
document.getElementById("scanButton").addEventListener("click", function() {
  if (scanning) return;

  const video = document.getElementById("video");
  video.classList.remove("hidden");

  codeReader = new ZXing.BrowserPDF417Reader();
  scanning = true;

  codeReader.decodeFromVideoDevice(null, video, (result, err) => {
    if (result) {
      handleScan(result.text);
    }
  });
});

/* ======================
   HANDLE SCAN RESULT
====================== */
function handleScan(text) {
  const parts = text.split("%");
  if (parts.length < 7) {
    alert("Invalid barcode format");
    stopScan();
    return;
  }
  document.getElementById("vehicleReg").value = parts[6].trim();
  stopScan();
}

/* ======================
   STOP SCAN
====================== */
function stopScan() {
  if (codeReader) {
    codeReader.reset();
  }
  scanning = false;
  document.getElementById("video").classList.add("hidden");
}

/* ======================
   CALCULATE TOTAL
====================== */
document.getElementById("motorcycles").addEventListener("input", e => {
  const qty = parseInt(e.target.value) || 0;
  document.getElementById("total").innerText = qty * 150;
});

/* ======================
   NAVIGATION
====================== */
function nextCard(n) {
  document.querySelectorAll(".card").forEach(c => c.classList.remove("active"));
  document.getElementById("card" + n).classList.add("active");

  if (n === 2) {
    document.getElementById("total2").innerText =
      document.getElementById("total").innerText;
  }
}
